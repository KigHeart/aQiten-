name: Research checks

on:
  push:
    branches:
      - main
      - "p0/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  box-rejection:
    name: Box-rejection finite-domain checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exhaustive mathematical checks
        run: python -m unittest research.test_box_rejection research.test_ring_profile -v
