[workspace]
resolver = "2"
members = ["crates/aqiten-error", "crates/aqiten-codec", "crates/aqiten-field", "crates/aqiten-ring", "crates/aqiten-transcript"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KigHeart/aQiten-"
authors = ["Tilil Engineering Group"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
overflow-checks = true
debug-assertions = false
lto = "thin"
